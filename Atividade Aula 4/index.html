<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 4 - Mídias em HTML</title>
</head>
<body>
    <header>
        <h1>Atividade 4 - Mídias em HTML</h1>
        <p>Exemplos de imagens, vídeo e áudio.</p>
    </header>

    <main>
        <img src="Imagens/Brio.jpg" alt="Você tem brio?"/>
        <img src="Imagens/golden.jpg" alt="Cachorro" width="300" height="200"/>
        <img src="Imagens/Arte.jpg" alt="arte daora" width="600"/>

        <video controls width="600" poster="Imagens/VIDEO LEGAL.png">
            <source src="Videos/labrador.mp4" type="video/mp4"/>
            Seu navegador não suporta o elemento de vídeo.
        </video>

        <video width="600" poster="Imagens/VIDEO LEGAL.png" autoplay muted loop>
            <source src="Videos/labrador.mp4" type="video/mp4"/>
            Seu navegador não suporta o elemento de vídeo.
        </video>

        <audio controls>
            <source src="Audios/A Bird's Last Look..mp3" type="audio/mpeg"/>
            <source src="Audios/A-Bird_s-Last-Look.ogg" type="audio/ogg"/>
            Seu navegador não suporta o elemento de áudio.
        </audio>

        <form action="#" method="post">
            <div>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div>
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" cols="40"></textarea>
            </div>

            <button type="submit">Enviar</button>
        </form>


    <a href="https://www.google.com">Ir para o Google</a>

   
    <a href="https://www.google.com">
        <img src="Imagens/golden.jpg" alt="Cachorro" width="150">
    </a>

  
    <a href="https://www.google.com" target="_blank" rel="noopener noreferrer">
        Abrir Google em nova aba
    </a>

    <ol>
         <li>Passo 1</li>

        <li>Passo 3</li>
    </ol>

    <ul>
        <li>Item A</li>
        <li>Item B</li>
        <li>Item C</li>
    </ul>

    </main>

    <footer>
        
    </footer>

</body>
</html>
